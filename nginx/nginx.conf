worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    types {
        application/vnd.apple.mpegurl  m3u8;
        video/mp2t                     ts;
        audio/mpegurl                  m3u;
    }

    server {
        listen 80;
        server_name _;

        # .ts segments: pueden cachearse (no cambian una vez escritos)
        location ~* \.ts$ {
            root /var/www/streams;
            add_header Cache-Control "max-age=3600";
            add_header Access-Control-Allow-Origin *;
        }

        # .m3u8 playlists: nunca cachear (cambian constantemente)
        location ~* \.m3u8$ {
            root /var/www/streams;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma no-cache;
            add_header Expires 0;
            add_header Access-Control-Allow-Origin *;
        }

        # Streams HLS completos
        location /streams/ {
            root /var/www;
            add_header Access-Control-Allow-Origin *;
        }

        # M3U para Emby: match exacto
        location = /eventos.m3u {
            root /var/www/data;
            default_type audio/mpegurl;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # API backend — service name, no container name
        location /api/ {
            proxy_pass         http://backend:8000/api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Dashboard
        location / {
            proxy_pass         http://backend:8000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}
