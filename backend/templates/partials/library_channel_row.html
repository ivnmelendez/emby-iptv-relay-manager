<tr class="table-row"
    data-name="{{ lib_ch.name | lower }}"
    data-group="{{ lib_ch.raw_group_title }}"
    x-show="
      (group === 'all' || $el.dataset.group === group) &&
      (search === '' || $el.dataset.name.includes(search.toLowerCase()))
    ">
  <!-- Logo + Name -->
  <td class="px-5 py-2.5">
    <div class="flex items-center gap-3">
      {% if lib_ch.logo %}
        <img src="{{ lib_ch.logo }}" alt="" class="w-7 h-7 rounded object-cover bg-hover shrink-0"
             onerror="this.style.display='none'">
      {% else %}
        <div class="w-7 h-7 rounded bg-hover shrink-0 flex items-center justify-center">
          <svg class="w-3.5 h-3.5 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"/>
          </svg>
        </div>
      {% endif %}
      <span class="text-sm text-[#e6edf3] truncate max-w-[220px]">{{ lib_ch.name }}</span>
    </div>
  </td>
  <!-- Group -->
  <td class="px-3 py-2.5 hidden md:table-cell">
    <span class="badge-group" title="{{ lib_ch.raw_group_title }}">{{ lib_ch.raw_group_title }}</span>
  </td>
  <!-- Action -->
  <td class="px-5 py-2.5 text-right">
    {% if lib_ch.managed %}
      <span class="text-xs font-medium text-emerald-400 flex items-center justify-end gap-1">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
        </svg>
        En relay list
      </span>
    {% else %}
      <form hx-post="/ui/provider/library/{{ lib_ch.id }}/manage"
            hx-target="closest tr"
            hx-swap="outerHTML">
        <button type="submit"
                class="btn-action bg-emerald-600/10 hover:bg-emerald-600/20 text-emerald-400 border-emerald-600/20 text-xs">
          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
          </svg>
          Agregar
        </button>
      </form>
    {% endif %}
  </td>
</tr>
