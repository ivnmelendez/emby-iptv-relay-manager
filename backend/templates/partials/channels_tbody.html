{% if errors %}
<tr>
  <td colspan="6" class="px-4 py-2">
    {% for err in errors %}
    <div class="flex items-center gap-2 px-3 py-2 rounded bg-amber-500/10 border border-amber-500/20 text-xs text-amber-300 mb-1">
      <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126Z"/>
      </svg>
      {{ err }}
    </div>
    {% endfor %}
  </td>
</tr>
{% endif %}

{% for ch in channels %}
  {% include "partials/channel_row.html" %}
{% else %}
<tr>
  <td colspan="6" class="px-4 py-16 text-center">
    <p class="text-sm text-muted">Sin canales en la relay list.</p>
    <p class="text-xs text-muted/60 mt-1">Ve a <a href="/provider" class="text-emerald-400 hover:underline">Provider</a> y agrega canales.</p>
  </td>
</tr>
{% endfor %}
