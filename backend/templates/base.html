<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IPTV Manager{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          colors: {
            surface: '#161b22',
            hover: '#21262d',
            border: '#30363d',
            muted: '#8b949e',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease; }
    .htmx-request .htmx-indicator, .htmx-indicator.htmx-request { opacity: 1; }
    .nav-link { @apply px-3 py-1.5 rounded-md text-sm font-medium text-[#8b949e] hover:text-[#e6edf3] hover:bg-[#21262d] transition-all duration-150; }
    .nav-link.active { @apply text-[#e6edf3] bg-[#21262d]; }
    .btn-primary { @apply inline-flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium rounded-md transition-colors duration-150 cursor-pointer; }
    .btn-secondary { @apply inline-flex items-center gap-2 px-4 py-2 bg-[#21262d] hover:bg-[#30363d] text-[#e6edf3] text-sm font-medium rounded-md border border-[#30363d] transition-colors duration-150 cursor-pointer; }
    .btn-danger { @apply inline-flex items-center gap-2 px-3 py-1.5 bg-red-600/10 hover:bg-red-600/20 text-red-400 text-xs font-medium rounded border border-red-500/20 transition-colors duration-150 cursor-pointer; }
    .btn-action { @apply inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded border transition-colors duration-150 cursor-pointer; }
    .card { @apply bg-surface border border-border rounded-xl p-6; }
    .badge-online { @apply inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20; }
    .badge-offline { @apply inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-500/10 text-gray-500 border border-gray-600/20; }
    .badge-group { @apply inline-flex px-2 py-0.5 rounded text-[11px] font-medium bg-indigo-500/10 text-indigo-300 border border-indigo-500/15 max-w-[200px] truncate; }
    .badge-suggested { @apply inline-flex px-2 py-0.5 rounded text-[11px] font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20; }
    .table-row { @apply border-b border-[#21262d] hover:bg-[#21262d]/40 transition-colors duration-100; }
    .input { @apply bg-[#21262d] border border-border rounded-md px-3 py-2 text-sm text-[#e6edf3] placeholder-muted focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/30 transition-colors; }
  </style>
</head>
<body class="min-h-screen" hx-indicator="#htmx-bar">

  <!-- HTMX progress bar -->
  <div id="htmx-bar" class="htmx-indicator fixed top-0 inset-x-0 h-[2px] bg-emerald-500 z-[200]"></div>

  <!-- Navbar -->
  <nav class="fixed top-0 inset-x-0 z-50 h-14 border-b border-border bg-[#0d1117]/95 backdrop-blur-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-full flex items-center gap-6">

      <!-- Logo -->
      <a href="/" class="flex items-center gap-2.5 shrink-0">
        <div class="w-7 h-7 bg-emerald-600 rounded-lg flex items-center justify-center shadow-lg shadow-emerald-900/40">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"/>
          </svg>
        </div>
        <span class="font-semibold text-[#e6edf3] text-sm tracking-wide">IPTV Manager</span>
      </a>

      <!-- Nav links -->
      <div class="flex items-center gap-0.5">
        <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
          <span class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            Dashboard
          </span>
        </a>
        <a href="/channels" class="nav-link {% if active_page == 'channels' %}active{% endif %}">
          <span class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 20.25h12m-7.5-3v3m-4.875-3h13.75c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875v11.25c0 .621.504 1.125 1.125 1.125Z"/>
            </svg>
            Channels
          </span>
        </a>
        <a href="/provider" class="nav-link {% if active_page == 'provider' %}active{% endif %}">
          <span class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>
            </svg>
            Provider
          </span>
        </a>
        <a href="/logs" class="nav-link {% if active_page == 'logs' %}active{% endif %}">
          <span class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
            </svg>
            Logs
          </span>
        </a>
      </div>

      <!-- Right: active streams badge -->
      <div class="ml-auto flex items-center gap-3">
        {% if active_count > 0 %}
          <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-xs font-medium text-emerald-400">{{ active_count }}/{{ max_streams }} activos</span>
          </div>
        {% else %}
          <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-[#21262d] border border-border">
            <span class="w-1.5 h-1.5 rounded-full bg-gray-600"></span>
            <span class="text-xs text-muted">0/{{ max_streams }} activos</span>
          </div>
        {% endif %}
      </div>

    </div>
  </nav>

  <!-- Main -->
  <main class="pt-14 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
      {% block content %}{% endblock %}
    </div>
  </main>

</body>
</html>
